# Запускается: сам при каждом push в main/master, вручную (Actions -> Desktop build -> Run workflow),
# а по тегу  git tag v1.1.0 && git push origin v1.1.0  ещё и создаёт Release с файлами.
name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # старый glibc -> бинарник запустится на большинстве дистрибутивов
            name: linux-x86_64
            sep: ":"
            exe: PixelPisun
          - os: windows-latest
            name: windows-x86_64
            sep: ";"
            exe: PixelPisun.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Найти папку с игрой (где лежит main.py)
        id: where
        shell: bash
        run: |
          f=$(find . -name main.py -not -path "./.git/*" -not -path "*/node_modules/*" | head -1)
          if [ -z "$f" ]; then echo "main.py не найден в репозитории"; ls -R | head -50; exit 1; fi
          d=$(dirname "$f")
          echo "Папка игры: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Зависимости
        run: python -m pip install --upgrade pip pygame pyinstaller pillow

      - name: Иконка .ico
        working-directory: ${{ steps.where.outputs.dir }}
        run: python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Сборка (PyInstaller)
        working-directory: ${{ steps.where.outputs.dir }}
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PixelPisun
          --icon icon.ico --add-data "icon.png${{ matrix.sep }}."
          main.py

      - name: Проверка запуска без окна (smoke test)
        working-directory: ${{ steps.where.outputs.dir }}
        shell: bash
        run: |
          pip install --quiet pygame
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy PISUN_PROFILE="$RUNNER_TEMP/p.json" python main.py --smoke-test

      - name: Упаковка
        working-directory: ${{ steps.where.outputs.dir }}
        shell: bash
        run: |
          mkdir -p release/PixelPisun
          cp "dist/${{ matrix.exe }}" release/PixelPisun/
          printf 'Пиксельный Писюн — Стройка века\nКО-ОП: кнопка КО-ОП в меню. Нужен доступ к сети (брандмауэр).\nУправление: стрелки/AD, Пробел, Shift, G, E, Esc, F11.\n' > release/PixelPisun/README.txt
          cd release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "../PixelPisun-${{ matrix.name }}.zip" PixelPisun
          else
            tar czf "../PixelPisun-${{ matrix.name }}.tar.gz" PixelPisun
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PixelPisun-${{ matrix.name }}
          path: |
            ${{ steps.where.outputs.dir }}/PixelPisun-*.zip
            ${{ steps.where.outputs.dir }}/PixelPisun-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
